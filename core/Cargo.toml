[package]
name = "neko-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10"
hex = "0.4.3"
libc = "0.2.190"
rrule = "0.14.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "2"

# Small and quick to start: these run often, from the shell
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
