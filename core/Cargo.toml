[package]
name = "neko-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10"
hex = "0.4.3"
libc = "0.2.190"
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
toml = "1.1.8"
ureq = "2"
zbus = "5.19.0"

# Small and quick to start: these run often, from the shell
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
